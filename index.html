<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063b7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sri Ramajayam RMC">
<title>Sri Ramajayam RMC</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#063b7a;--blue2:#0867c9;--green:#168447;--bg:#f4f7fb;--text:#172033;--muted:#667085}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:var(--bg);color:var(--text)}
.app{max-width:560px;margin:auto;min-height:100vh}.top{background:linear-gradient(135deg,#063b7a,#0867c9);color:white;padding:16px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.brand img{width:45px;height:45px;object-fit:contain;background:#fff;border-radius:9px}.brand b{font-size:16px}.brand small{display:block;font-size:10px;opacity:.9}nav{display:flex;gap:7px;overflow:auto;margin-top:12px}nav button{border:0;background:#ffffff25;color:#fff;border-radius:9px;padding:9px 11px;white-space:nowrap;font-weight:700}
main{padding:14px 14px 80px}.page{display:none}.page.active{display:block}h2{font-size:20px;margin:6px 0 12px}.card{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 12px #12305a0b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{text-align:center;padding:13px 5px;background:#fff;border-radius:12px}.stat strong{display:block;font-size:19px;color:var(--blue)}.stat span{font-size:10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tile{border:0;border-radius:14px;padding:18px 7px;color:#fff;font-weight:800;min-height:92px}.tile small{display:block;font-weight:500;margin-top:5px}.b{background:#2388e7}.g{background:#18a957}.o{background:#ee8b20}.p{background:#7451c7}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px;color:#344054}input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font-size:14px;background:#fff}textarea{min-height:65px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:800}.primary{background:var(--blue2);color:#fff}.green{background:var(--green);color:#fff}.secondary{background:#e9eef5;color:var(--blue)}.full{width:100%;margin-top:12px}
.item{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px}.item:last-child{border:0}.item small{display:block;color:var(--muted);margin-top:3px}.pill{background:#dcfce7;color:#166534;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:800}
.challan{background:white;border:2px solid #183f76;padding:12px;margin-top:8px}.ct{text-align:center;color:#173e75;font-weight:900;font-size:17px}.cs{text-align:center;font-size:10px}.line{border-top:1px solid #222;margin:8px 0}.fields{display:grid;grid-template-columns:1fr 1fr}.field{padding:6px;border-bottom:1px dotted #777;font-size:12px}.field b{display:block;font-size:9px}.sig{height:115px;border:1px solid #aaa;border-radius:8px;touch-action:none;background:#fff}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:22px;display:none;z-index:20}
@media print{.top,.no-print,main>section:not(#preview){display:none!important}.page#preview{display:block}.app{max-width:none}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><img src="sri_ramajayam_logo.png"><div><b>SRI RAMAJAYAM</b><small>READY MIX CONCRETE</small></div></div>
<nav><button onclick="show('home')">Home</button><button onclick="show('new')">New Challan</button><button onclick="show('orders')">Orders</button><button onclick="show('history')">History</button><button onclick="show('reports')">Reports</button></nav></header>
<main>
<section id="home" class="page active"><h2>Dashboard</h2><div class="card"><div class="stats"><div class="stat"><strong id="loads">0</strong><span>Today's Loads</span></div><div class="stat"><strong id="qty">0.0 m³</strong><span>Today's Quantity</span></div><div class="stat"><strong id="pending">0</strong><span>Pending Orders</span></div><div class="stat"><strong id="balance">0.0 m³</strong><span>Balance Quantity</span></div></div></div>
<button class="btn green full" onclick="show('new')">＋ New Delivery Challan</button><div class="grid"><button class="tile b" onclick="show('orders')">📦<br>Orders<small>Track balance</small></button><button class="tile o" onclick="show('history')">📋<br>History<small>Search challans</small></button><button class="tile p" onclick="show('reports')">📊<br>Reports<small>Daily & grade</small></button><button class="tile g" onclick="show('settings')">⚙️<br>Settings<small>Backup & company</small></button></div></section>

<section id="new" class="page"><h2>New Delivery Challan</h2><div class="card"><div class="row"><div><label>Challan No.</label><input id="no" readonly></div><div><label>Date</label><input id="date" type="date"></div></div>
<label>Order</label><select id="order"><option value="">No linked order</option></select><label>Vehicle No.</label><input id="vehicle" placeholder="TN 63 BW 1305"><label>Driver Name</label><input id="driver"><label>Customer Name</label><input id="customer"><label>Customer Address</label><input id="address"><label>Location / Site</label><input id="site">
<div class="row"><div><label>Grade</label><select id="grade"><option>M20</option><option>M25</option><option selected>M30</option><option>M35</option><option>M40</option></select></div><div><label>Quantity (m³)</label><input id="q" type="number" step=".1" value="3"></div></div>
<div class="row"><div><label>Slump (mm)</label><input id="slump" type="number" value="110"></div><div><label>Mode</label><select id="mode"><option>Pumping</option><option>Dumping</option></select></div></div>
<div class="row"><div><label>Dispatch Time</label><input id="dispatch" type="time"></div><div><label>In Time</label><input id="in" type="time"></div></div><label>Remarks</label><textarea id="remarks"></textarea>
<button class="btn primary full" onclick="create()">Generate Challan</button></div></section>

<section id="preview" class="page"><h2>Challan Preview</h2><div id="pv"></div><button class="btn primary full no-print" onclick="window.print()">Print / Save PDF</button><button class="btn green full no-print" onclick="share()">Share / WhatsApp</button><button class="btn secondary full no-print" onclick="openSig()">✍️ Customer Signature</button></section>

<section id="orders" class="page"><h2>Orders</h2><div class="card"><label>Customer</label><input id="oc"><label>Site</label><input id="os"><div class="row"><div><label>Grade</label><select id="og"><option>M20</option><option>M25</option><option selected>M30</option><option>M35</option></select></div><div><label>Order Qty (m³)</label><input id="oq" type="number" value="30"></div></div><button class="btn primary full" onclick="addOrder()">+ Create Order</button></div><div class="card" id="ordersList"></div></section>

<section id="history" class="page"><h2>Challan History</h2><input id="search" oninput="history()" placeholder="Search challan, customer, vehicle..."><div class="card" id="historyList"></div></section>
<section id="reports" class="page"><h2>Reports</h2><div class="card" id="report"></div></section>
<section id="settings" class="page"><h2>Settings</h2><div class="card"><label>Company Name</label><input id="company" value="SRI RAMAJAYAM READY MIX CONCRETE"><label>GSTIN</label><input id="gst" value="33NCKPS1548L1ZV"><label>Mobile</label><input id="mobile" value="97860 44703"><button class="btn primary full" onclick="saveSettings()">Save</button><button class="btn secondary full" onclick="backup()">Export Backup</button><label>Restore Backup</label><input type="file" accept=".json" onchange="restore(event)"></div></section>
</main></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:#0008;z-index:15;align-items:flex-end"><div style="background:#fff;width:100%;max-width:560px;margin:auto;padding:18px;border-radius:18px 18px 0 0"><h3>Customer Signature</h3><canvas id="sig" class="sig"></canvas><div class="row"><button class="btn secondary" onclick="clearSig()">Clear</button><button class="btn primary" onclick="saveSig()">Save</button></div></div></div><div id="toast"></div>
<script>
const K='rmc_nomac_v1',O='rmc_nomac_orders',S='rmc_nomac_settings';let data=JSON.parse(localStorage.getItem(K)||'[]'),orders=JSON.parse(localStorage.getItem(O)||'[]'),settings=JSON.parse(localStorage.getItem(S)||'{}'),current=null,sigData='';
const $=x=>document.getElementById(x);function persist(){localStorage.setItem(K,JSON.stringify(data));localStorage.setItem(O,JSON.stringify(orders));localStorage.setItem(S,JSON.stringify(settings));update();history();renderOrders();reports();fillOrders()}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='new')reset();if(id==='history')history();if(id==='orders')renderOrders();if(id==='reports')reports();if(id==='settings')loadSettings()}
function reset(){$('no').value=String(1335+data.length+1);$('date').value=new Date().toISOString().slice(0,10);if(!$('dispatch').value)$('dispatch').value=new Date().toTimeString().slice(0,5);fillOrders()}
function fillOrders(){$('order').innerHTML='<option value="">No linked order</option>'+orders.filter(o=>o.balance>0).map(o=>`<option value="${o.id}">${o.id} • ${o.customer} • ${o.balance.toFixed(1)} m³ balance</option>`).join('')}
function addOrder(){let customer=$('oc').value,site=$('os').value,q=+$('oq').value;if(!customer||!q)return toast('Enter customer and quantity');orders.unshift({id:'ORD-'+Date.now().toString().slice(-6),customer,site,grade:$('og').value,ordered:q,delivered:0,balance:q});persist();$('oc').value='';$('os').value='';toast('Order created')}
function create(){let c={no:$('no').value,date:$('date').value,order:$('order').value,vehicle:$('vehicle').value,driver:$('driver').value,customer:$('customer').value,address:$('address').value,site:$('site').value,grade:$('grade').value,quantity:+$('q').value,slump:+$('slump').value,mode:$('mode').value,dispatch:$('dispatch').value,in:$('in').value,remarks:$('remarks').value,signature:sigData};if(!c.vehicle||!c.customer||!c.quantity)return toast('Vehicle, customer and quantity are required');if(c.order){let o=orders.find(x=>x.id===c.order);if(o&&c.quantity>o.balance)return toast('Quantity exceeds order balance');if(o){o.delivered+=c.quantity;o.balance=o.ordered-o.delivered}}data.unshift(c);current=c;persist();preview(c);show('preview');toast('Challan '+c.no+' created')}
function preview(c){$('pv').innerHTML=`<div class="challan"><div class="ct">${settings.company||'SRI RAMAJAYAM READY MIX CONCRETE'}</div><div class="cs">NORTH STREET, KOLLAPURAM, ARIYALUR - 621 705<br>CELL : ${settings.mobile||'97860 44703'} | GSTIN : ${settings.gst||'33NCKPS1548L1ZV'}</div><div class="line"></div><div class="ct" style="font-size:14px">DELIVERY CHALLAN</div><div class="line"></div><div class="fields"><div class="field"><b>CHALLAN NO.</b>${c.no}</div><div class="field"><b>DATE</b>${c.date}</div><div class="field"><b>VEHICLE NO.</b>${c.vehicle}</div><div class="field"><b>DRIVER NAME</b>${c.driver||'-'}</div><div class="field"><b>CUSTOMER NAME</b>${c.customer}</div><div class="field"><b>TOTAL M³</b>${c.quantity.toFixed(1)}</div><div class="field"><b>CUSTOMER ADDRESS</b>${c.address||'-'}</div><div class="field"><b>LOCATION / SITE</b>${c.site||'-'}</div><div class="field"><b>GRADE</b>${c.grade}</div><div class="field"><b>SLUMP</b>${c.slump} mm</div><div class="field"><b>MODE</b>${c.mode}</div><div class="field"><b>ORDER</b>${c.order||'-'}</div></div><div class="line"></div><div class="fields"><div class="field"><b>DISPATCH TIME</b>${c.dispatch||'-'}</div><div class="field"><b>IN TIME</b>${c.in||'-'}</div></div><div style="height:65px"></div><div class="line"></div><div style="display:flex;justify-content:space-between;font-size:9px"><b>CUSTOMER SIGNATURE</b><b>FOR SRI RAMAJAYAM READY MIX CONCRETE</b></div></div>`}
function history(){if(!$('historyList'))return;let q=($('search').value||'').toLowerCase();let a=data.filter(c=>JSON.stringify(c).toLowerCase().includes(q));$('historyList').innerHTML=a.length?a.map(c=>`<div class="item"><div><b>${c.no}</b><small>${c.customer}<br>${c.vehicle} • ${c.quantity.toFixed(1)} m³ • ${c.grade}</small></div><button class="btn secondary" onclick="openC('${c.no}')">View</button></div>`).join(''):'<p style="color:#667085">No challans found.</p>'}
function openC(n){current=data.find(c=>c.no===n);preview(current);show('preview')}
function renderOrders(){$('ordersList').innerHTML=orders.length?orders.map(o=>`<div class="item"><div><b>${o.id}</b><small>${o.customer} • ${o.site||'-'}<br>${o.grade} • Ordered ${o.ordered.toFixed(1)} m³</small></div><span class="pill">${o.balance.toFixed(1)} bal.</span></div>`).join(''):'<p style="color:#667085">No orders.</p>'}
function reports(){let q=data.reduce((a,c)=>a+c.quantity,0),grades={};data.forEach(c=>grades[c.grade]=(grades[c.grade]||0)+c.quantity);$('report').innerHTML=`<b>Summary</b><div class="stats" style="margin-top:10px"><div class="stat"><strong>${data.length}</strong><span>Loads</span></div><div class="stat"><strong>${q.toFixed(1)}</strong><span>Total m³</span></div></div><h4>Grade-wise</h4>`+Object.entries(grades).map(([g,v])=>`<div class="item"><span>${g}</span><b>${v.toFixed(1)} m³</b></div>`).join('')}
function update(){let d=data.filter(c=>c.date===new Date().toISOString().slice(0,10));$('loads').textContent=d.length;$('qty').textContent=d.reduce((a,c)=>a+c.quantity,0).toFixed(1)+' m³';$('pending').textContent=orders.filter(o=>o.balance>0).length;$('balance').textContent=orders.reduce((a,o)=>a+o.balance,0).toFixed(1)+' m³'}
function openSig(){$('modal').style.display='flex';let c=$('sig'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);x.lineWidth=2;x.lineCap='round';let down=false;c.onpointerdown=e=>{down=true;x.beginPath();x.moveTo(e.offsetX,e.offsetY)};c.onpointermove=e=>{if(down){x.lineTo(e.offsetX,e.offsetY);x.stroke()}};c.onpointerup=()=>down=false;c.onpointerleave=()=>down=false}
function clearSig(){openSig()}
function saveSig(){sigData=$('sig').toDataURL('image/png');$('modal').style.display='none';if(current){current.signature=sigData;let i=data.findIndex(x=>x.no===current.no);if(i>=0)data[i]=current;persist();preview(current)}toast('Signature saved')}
function share(){let t=`RMC Delivery Challan ${current.no}\nCustomer: ${current.customer}\nVehicle: ${current.vehicle}\nQuantity: ${current.quantity} m³\nGrade: ${current.grade}`;if(navigator.share)navigator.share({title:'RMC Delivery Challan',text:t});else toast('Save PDF and share through WhatsApp')}
function saveSettings(){settings={company:$('company').value,gst:$('gst').value,mobile:$('mobile').value};persist();toast('Settings saved')}
function loadSettings(){$('company').value=settings.company||'SRI RAMAJAYAM READY MIX CONCRETE';$('gst').value=settings.gst||'33NCKPS1548L1ZV';$('mobile').value=settings.mobile||'97860 44703'}
function backup(){let a=document.createElement('a'),b=new Blob([JSON.stringify({data,orders,settings})],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='SriRamajayam_RMC_Backup.json';a.click()}
function restore(e){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);data=x.data||[];orders=x.orders||[];settings=x.settings||{};persist();toast('Backup restored')}catch(_){toast('Invalid backup')}};r.readAsText(f)}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
reset();update();history();renderOrders();reports();
</script></body></html>
